name: Update Google Scholar metrics

on:
  schedule:
    # Run at 00:00 on the 1st day of Jan, Apr, Jul, Oct (every 3rd month)
    - cron: "0 0 1 1,4,7,10 *"
  workflow_dispatch: {}   # allow manual run from Actions tab

jobs:
  update-metrics:
    runs-on: ubuntu-latest

    # This workflow commits back to the same repo/branch (main)
    permissions:
      contents: write    # required so the workflow can push commits

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          # Use the GITHUB_TOKEN so we can push back to main
          persist-credentials: true
          ref: main

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: |
        python -m pip install --upgrade pip
        python -m pip install -r requirements.txt
        python -c "import scholarly, bibtexparser; print('scholarly', getattr(scholarly,'__version__','unknown'), 'bibtexparser', getattr(bibtexparser,'__version__','unknown'))"

      - name: Run metrics update script
        run: |
          python scripts/update_scholar_metrics.py

      - name: Commit changes
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          # Only commit if there are changes
          if [[ -n "$(git status --porcelain)" ]]; then
            git add data/scholar_metrics.json
            git commit -m "chore: update Scholar metrics [skip ci]"
          else
            echo "No changes to commit."
          fi

      - name: Push changes to main
        run: |
          # Push only if we actually created a commit
          if git log -1 --pretty=%B | grep -q "chore: update Scholar metrics"; then
            git push origin main
          else
            echo "Nothing to push."
          fi
